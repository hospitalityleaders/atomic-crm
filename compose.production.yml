services:
  crm:
    image: ghcr.io/hospitalityleaders/atomic-crm:latest
    pull_policy: always
    container_name: holedo-crm-web
    restart: unless-stopped
    init: true

    environment:
      # Application
      NODE_ENV: "production"
      PORT: "3000"
      APP_ORIGIN: "https://crm.holedo.com"
      TRUST_PROXY: "1"

      # UpCloud Managed PostgreSQL
      DB_HOST: "holedo-postgresql-production-gympboioheqo.db.upclouddatabases.com"
      DB_PORT: "11569"
      DB_NAME: "holedo_crm"
      DB_USER: "holedo_crm"
      DB_PASSWORD: "___________________________"
      DB_MIGRATION_USER: "holedo_crm_owner"
      DB_MIGRATION_PASSWORD: "___________________________"
      DB_SSL: "true"
      DB_SSL_REJECT_UNAUTHORIZED: "false"
      DB_POOL_MAX: "10"
      DB_CONNECT_TIMEOUT_MS: "5000"
      DB_IDLE_TIMEOUT_MS: "30000"

      # UpCloud Managed Object Storage
      # Create one private bucket named holedo-crm and a dedicated access key.
      S3_ENDPOINT: "https://gdrv6.upcloudobjects.com"
      S3_REGION: "europe-2"
      S3_BUCKET: "holedo-crm"
      S3_ACCESS_KEY_ID: "___________________________"
      S3_SECRET_ACCESS_KEY: "___________________________"
      S3_FORCE_PATH_STYLE: "false"
      S3_CREATE_BUCKET: "false"
      S3_SIGNED_URL_TTL_SECONDS: "300"
      FILE_UPLOAD_LIMIT: "10mb"

      # Holedo Keycloak / OpenID Connect
      OIDC_ISSUER_URL: "https://identity.holedo.com/realms/holedo"
      OIDC_CLIENT_ID: "holedo-crm"
      OIDC_CLIENT_SECRET: "___________________________"
      OIDC_REDIRECT_URI: "https://crm.holedo.com/auth/callback"
      OIDC_POST_LOGOUT_REDIRECT_URI: "https://crm.holedo.com/"
      SESSION_SECRET: "___________________________"
      SESSION_COOKIE_DOMAIN: ".holedo.com"
      SESSION_MAX_AGE_SECONDS: "43200"
      PLATFORM_ADMIN_ROLE: "holedo-platform-admin"

      # Company workspaces are provisioned by Holedo administrators initially.
      ALLOW_SELF_SERVICE_COMPANY_WORKSPACES: "false"

    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

    networks:
      npm_proxy:
        aliases:
          - holedo-crm-web

networks:
  npm_proxy:
    external: true
    name: npm_proxy
