# ONE USE ONLY. This permanently removes the old CRM database objects.
# Take an UpCloud snapshot first, replace the password placeholder, deploy this
# stack once, confirm that it exits successfully, and then delete the stack.
services:
  database-reset:
    image: postgres:17-alpine
    pull_policy: always
    container_name: holedo-crm-database-reset
    restart: "no"

    environment:
      PGHOST: "holedo-postgresql-production-gympboioheqo.db.upclouddatabases.com"
      PGPORT: "11569"
      PGDATABASE: "holedo_crm"
      PGUSER: "holedo_crm_app"
      PGPASSWORD: "___________________________"
      PGSSLMODE: "require"
      RESET_CONFIRMATION: "DELETE-holedo_crm"

    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test "$${RESET_CONFIRMATION}" = "DELETE-holedo_crm"
        actual_database="$$(psql -Atc 'SELECT current_database()')"
        test "$${actual_database}" = "holedo_crm"
        psql -v ON_ERROR_STOP=1 <<'SQL'
        BEGIN;
        DROP SCHEMA IF EXISTS atomic_crm CASCADE;
        DROP SCHEMA IF EXISTS public CASCADE;
        CREATE SCHEMA public AUTHORIZATION holedo_crm_app;
        GRANT ALL ON SCHEMA public TO holedo_crm_app;
        COMMIT;
        SQL
        remaining="$$(psql -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema IN ('public', 'atomic_crm')")"
        test "$${remaining}" = "0"
        echo "The holedo_crm database is clean. Remove this reset stack now."

    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
